[package]
name = "heron-agent"
version = "0.1.0"
edition = "2021"
description = "Ships Claude Code and Codex transcripts and terminal recordings to a Heron server"

[[bin]]
name = "heron-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
gethostname = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
